[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-protocol"
version = "1.0.0"
description = "JARVIS Communication Protocol (JCP) — contratto fra interfaccia e backend"
requires-python = ">=3.11"

# Una sola dipendenza, di proposito: chi implementa un backend deve poter
# adottare il contratto senza tirarsi dietro Qt, audio o visione.
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[tool.setuptools]
packages = ["jarvis_protocol"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# BLE001 disattivo come nel resto del progetto: il contratto cattura in modo
# ampio ai confini di validazione, perche' un payload malformato deve essere
# scartato e non propagato.
ignore = ["BLE001"]
