[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-adapter-openclaw"
version = "0.1.0"
description = "Adapter JCP ↔ OpenClaw"
requires-python = ">=3.11"
dependencies = ["jarvis-protocol>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = ["jarvis_adapter_openclaw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# BLE001 disattivo come nel resto del progetto: il contratto cattura in modo
# ampio ai confini di validazione, perche' un payload malformato deve essere
# scartato e non propagato.
ignore = ["BLE001"]
